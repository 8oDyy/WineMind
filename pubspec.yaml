name: winemind
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^8.0.3

  # Functional programming
  dartz: ^0.10.1

  # SVG support
  flutter_svg: ^2.0.10

  # Supabase
  supabase_flutter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.13
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/logo-winemind.svg
    - assets/img/Paul_Happy.png